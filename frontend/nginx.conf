server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Known frontend routes — exact matches win over the short-code regex
    # below, so these never get mistaken for a short code.
    location = /history { try_files $uri /index.html; }
    location = /signin  { try_files $uri /index.html; }
    location = /signup  { try_files $uri /index.html; }

    # API — same-origin proxy so the auth + anon-session cookies (both
    # httpOnly, sameSite=lax) are sent without any cross-origin fuss.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Everything else that looks like a bare short code (single path
    # segment, base62 charset, no file extension) goes to the backend for
    # the actual 302 redirect. This must come after the exact-match SPA
    # routes above (nginx gives location = matches top priority) but is
    # otherwise a catch-all for e.g. GET /aB3xZ9.
    location ~ ^/[0-9a-zA-Z-]{1,32}$ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets and the SPA fallback (index.html) for anything left —
    # covers /, /assets/*, /favicon.svg, /icons.svg, and client-side routes
    # not listed above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
